server:
  port: ${SERVER_PORT:8000}
  shutdown: graceful

spring:
  application:
    name: bitpongo-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zhitoubao}
    username: ${DATABASE_USERNAME:zhitoubao}
    password: ${DATABASE_PASSWORD:}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      # JobStoreTX 自管事务并提交；Spring Boot 默认的 LocalDataSourceJobStore(CMT) 依赖容器事务，
      # 在事务外触发时状态更新无法提交，触发器会进入 ERROR 状态、计划任务永不执行。
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.dataSource: quartzDataSource
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.dataSource.quartzDataSource.provider: hikaricp
      org.quartz.dataSource.quartzDataSource.driver: com.mysql.cj.jdbc.Driver
      org.quartz.dataSource.quartzDataSource.URL: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zhitoubao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      org.quartz.dataSource.quartzDataSource.user: ${DATABASE_USERNAME:zhitoubao}
      org.quartz.dataSource.quartzDataSource.password: ${DATABASE_PASSWORD:}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

zhitoubao:
  scheduling-zone: ${SCHEDULING_ZONE:Asia/Shanghai}
  notifications:
    bark:
      user-notifications-enabled: ${BARK_USER_NOTIFICATIONS_ENABLED:true}
      admin-push-url: ${BARK_ADMIN_PUSH_URL:}
      allowed-hosts: ${BARK_ALLOWED_HOSTS:api.day.app}
      allow-private-hosts: ${BARK_ALLOW_PRIVATE_HOSTS:false}
      credential-encryption-key: ${BARK_CREDENTIAL_ENCRYPTION_KEY:}
      dispatch-enabled: ${BARK_DISPATCH_ENABLED:true}
      notify-on-startup: ${BARK_NOTIFY_ON_STARTUP:false}
      app-public-url: ${APP_PUBLIC_URL:}
  cors:
    allowed-origins: ${BACKEND_CORS_ORIGINS:*}
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:300}
  binance:
    live-trading: ${BINANCE_LIVE_TRADING:false}
    testnet-rest-base-url: ${BINANCE_TESTNET_REST_BASE_URL:https://testnet.binance.vision}
    production-rest-base-url: ${BINANCE_PRODUCTION_REST_BASE_URL:https://api.binance.com}
    market-stream-url: ${BINANCE_MARKET_STREAM_URL:wss://stream.binance.com:9443}
    market-stream-max-message-size: ${BINANCE_MARKET_STREAM_MAX_MESSAGE_SIZE:1048576}
  market:
    stream-enabled: ${MARKET_STREAM_ENABLED:true}
    price-max-age: ${MARKET_PRICE_MAX_AGE_SECONDS:60}s
    health-max-silence: ${MARKET_HEALTH_MAX_SILENCE_SECONDS:120}s
    connection-rotation: ${MARKET_CONNECTION_ROTATION:PT23H50M}
  orders:
    reconciliation-delay: ${ORDER_RECONCILIATION_DELAY:60s}
    reconciliation-stale-age: ${ORDER_RECONCILIATION_STALE_AGE:PT30S}
    reconciliation-max-attempts: ${ORDER_RECONCILIATION_MAX_ATTEMPTS:20}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-} userId=%X{userId:-}]"
